# ---
# relationships:
#   implements: package-repository-publishing
# ---

name: Submit package release
description: Commit one canonical package release manifest to repo.wyrd.foo

inputs:
  manifest:
    description: Path to the package selection manifest in the caller workspace
    required: true
  tag:
    description: Released unit tag (defaults to the manifest tag)
    required: false
  version:
    description: Released unit version (defaults to the manifest version)
    required: false
  release-assets:
    description: JSON array of release-record assets with name and sha256 digest
    required: false

  app-client-id:
    description: Client ID of the repo.wyrd.foo publisher GitHub App
    required: true
  app-private-key:
    description: Private key of the repo.wyrd.foo publisher GitHub App
    required: true

outputs:
  submission-id:
    description: Stable manifest path and canonical SHA-256 identity; not consumer visibility
    value: ${{ steps.submit.outputs.submission-id }}
  manifest-path:
    description: Canonical path in the fixed inbox
    value: ${{ steps.submit.outputs.manifest-path }}
  inbox-commit:
    description: Immutable commit containing this submission
    value: ${{ steps.submit.outputs.inbox-commit }}
  state:
    description: created or unchanged
    value: ${{ steps.submit.outputs.state }}

runs:
  using: composite
  steps:
    - name: Create repository-scoped installation token
      id: token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: wyrd-company
        repositories: repo.wyrd.foo
        permission-contents: write

    - name: Verify release record and submit immutable manifest
      id: submit
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_ASSETS: ${{ inputs.release-assets }}
        SOURCE_TOKEN: ${{ github.token }}
        APP_TOKEN: ${{ steps.token.outputs.token }}
      run: python3 "$GITHUB_ACTION_PATH/../../../scripts/submit-release.py"
